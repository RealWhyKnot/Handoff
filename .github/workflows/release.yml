name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v2026.5.22.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history + all tags so the release-body step can diff
          # commits against the previous version tag for the changelog.
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Validate PowerShell and release scripts
        shell: pwsh
        run: |
          ./.github/scripts/Test-WorkflowSyntax.ps1
          ./.github/scripts/Test-ResolveReleaseBaseTag.ps1
          ./.github/scripts/Test-NewReleaseNotes.ps1

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"

      - name: Resolve version from tag
        id: ver
        uses: RealWhyKnot/workflows/resolve-tag@v1
        with:
          tag: ${{ github.event.inputs.tag }}
          prerelease-pattern: '^v\d{4}\.\d+\.\d+\.\d+-.+$'

      - name: Validate release version sequence
        uses: RealWhyKnot/workflows/version-sequence@v1
        with:
          tag: '${{ steps.ver.outputs.tag }}'

      - name: Fetch picotool
        shell: pwsh
        run: |
          ./scripts/fetch-picotool.ps1

      - name: Build with embedded picotool
        shell: pwsh
        env:
          HANDOFF_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          cargo build --release --locked --features embed_picotool
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed with exit code $LASTEXITCODE" }
          Copy-Item target/release/handoff.exe handoff.exe
          ./handoff.exe version

      - name: Write release manifest
        id: manifest
        shell: pwsh
        env:
          HANDOFF_VERSION: ${{ steps.ver.outputs.version }}
          HANDOFF_TAG: ${{ steps.ver.outputs.tag }}
        run: |
          $sha = (Get-FileHash -Algorithm SHA256 handoff.exe).Hash.ToLower()
          $manifest = [ordered]@{
            version = $env:HANDOFF_VERSION
            sha256  = $sha
            url     = "https://github.com/${{ github.repository }}/releases/download/$env:HANDOFF_TAG/handoff.exe"
            notes   = "Release $env:HANDOFF_TAG"
          }
          $manifest | ConvertTo-Json -Compress | Out-File -FilePath handoff-version.json -Encoding ASCII
          Get-Content handoff-version.json
          "sha256=$sha" >> $env:GITHUB_OUTPUT

      - name: Build the changelog
        id: changelog
        uses: RealWhyKnot/workflows/release-notes@v1
        with:
          tag: ${{ steps.ver.outputs.tag }}
          title: Handoff ${{ steps.ver.outputs.tag }}

      - name: Compose release notes
        id: body
        env:
          TAG_NAME: ${{ steps.ver.outputs.tag }}
          EXE_SHA256: ${{ steps.manifest.outputs.sha256 }}
          CHANGELOG_PATH: ${{ steps.changelog.outputs.file }}
        shell: pwsh
        run: |
          $notes = (& ./.github/scripts/New-ReleaseNotes.ps1 -Tag $env:TAG_NAME -Repo $env:GITHUB_REPOSITORY -ChangelogPath $env:CHANGELOG_PATH -ExeSha256 $env:EXE_SHA256) -join "`n"
          if (-not $notes) { throw "New-ReleaseNotes.ps1 returned an empty body" }
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          [System.IO.File]::WriteAllText($notesPath, $notes, (New-Object System.Text.UTF8Encoding($false)))
          "file=$notesPath" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub release
        uses: RealWhyKnot/workflows/publish-release@v1
        with:
          tag: ${{ steps.ver.outputs.tag }}
          notes-file: ${{ steps.body.outputs.file }}
          prerelease: ${{ steps.ver.outputs.prerelease }}
          draft-first: 'true'
          assets: |
            handoff.exe
            handoff-version.json
