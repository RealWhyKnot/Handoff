name: Nightly beta

on:
  schedule:
    - cron: '5 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: nightly-beta-release
  cancel-in-progress: false

jobs:
  tag:
    uses: RealWhyKnot/workflows/.github/workflows/nightly-beta-scripted.yml@v1
    with:
      runs-on: windows-latest
      validate-scripts: |
        ./.github/scripts/Test-WorkflowSyntax.ps1
        ./.github/scripts/Test-NightlyBetaPlan.ps1
        ./.github/scripts/Test-ResolveReleaseBaseTag.ps1
