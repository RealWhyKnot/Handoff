name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    permissions:
      contents: read
    uses: RealWhyKnot/workflows/.github/workflows/repo-checks.yml@v1

  build:
    name: lint + build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate PowerShell and release scripts
        shell: pwsh
        run: |
          ./.github/scripts/Test-NightlyBetaPlan.ps1
          ./.github/scripts/Test-ResolveReleaseBaseTag.ps1

      - name: Rust toolchain
        uses: RealWhyKnot/workflows/setup-rust@v1

      - name: Install PowerShell analyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Lint and test
        shell: pwsh
        run: ./.github/lint/lint.ps1

      - name: Fetch picotool
        shell: pwsh
        run: ./scripts/fetch-picotool.ps1

      - name: cargo build (embedded)
        run: cargo build --release --locked --features embed_picotool
