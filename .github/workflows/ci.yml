name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go build (default)
        run: go build -v ./...

      - name: Fetch picotool
        shell: pwsh
        run: ./scripts/fetch-picotool.ps1

      - name: go build (embedded)
        run: go build -tags embed_picotool -v ./...
