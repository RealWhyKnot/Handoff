name: Feature request
description: A command, option or change you'd like Handoff to have.
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation Handoff doesn't handle yet.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: What you'd like it to do. Details are welcome but optional.
    validations:
      required: false
