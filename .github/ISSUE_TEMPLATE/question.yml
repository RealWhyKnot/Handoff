name: Question
description: Setup help, or not sure whether something is a bug.
title: "[question] "
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Handoff version
      description: From `handoff version`, if you have it installed.
    validations:
      required: false
