[package]
name = "handoff"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
publish = false
build = "build.rs"

[lib]
name = "handoff"
path = "src/lib.rs"

[[bin]]
name = "handoff"
path = "src/main.rs"

[features]
default = []
embed_picotool = []

[dependencies]
base64 = "0.23"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
jpeg-encoder = "0.7.1"
num-traits = "0.2.19"
png = "0.18.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "gzip", "zstd"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "process", "io-util", "signal"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
tokio-util = "0.7"
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
url = "2"
zstd = { version = "0.14", default-features = false }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_Power",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[workspace.lints.rust]
unknown_lints = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
self_named_module_files = "deny"
ref_option = "deny"
needless_pass_by_value = "deny"
fn_params_excessive_bools = "deny"
clone_on_ref_ptr = "deny"
redundant_clone = "deny"
match_wildcard_for_single_variants = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_lossless = "deny"
cast_precision_loss = "deny"
as_conversions = "deny"
map_err_ignore = "deny"
format_push_string = "deny"
needless_collect = "deny"
significant_drop_tightening = "deny"
manual_assert_eq = "deny"
assert_is_empty = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
